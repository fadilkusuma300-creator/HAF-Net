dataset:
  name: taiwan
  path: data/raw/taiwan/data.csv
  mapping: metadata/feature_group_mapping.csv
  split: stratified_80_10_10

model:
  subgroup_dim: 32
  fusion_dim: 64
  dropout: 0.10

loss:
  beta: 0.999
  gamma: 2.0
  lambda_tcl: 0.0
  lambda_tcar: 0.05
  rho: 0.50
  theory_prior: [0.35, 0.30, 0.20, 0.15]
  prior_permutation: [1, 3, 0, 2]
  temperature: 0.10
  negatives: 8

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 100
  patience: 15
  seeds: [42, 123, 456, 789, 1024, 2024, 3456, 5678, 7890, 9999]
  device: auto
