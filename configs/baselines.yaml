selection_metric: average_precision

classical:
  xgboost:
    n_estimators: [300, 600, 900]
    max_depth: [3, 4, 6]
    learning_rate: [0.01, 0.03, 0.05]
    subsample: 0.85
    colsample_bytree: 0.85
  lightgbm:
    n_estimators: [300, 600, 900]
    num_leaves: [15, 31, 63]
    learning_rate: [0.01, 0.03, 0.05]
    subsample: 0.85
    colsample_bytree: 0.85
  catboost:
    iterations: [300, 600, 900]
    depth: [4, 6, 8]
    learning_rate: [0.01, 0.03, 0.05]

neural:
  tabnet_numeric_adapted:
    learning_rate: [0.0001, 0.0005, 0.001]
    width: [32, 64, 128]
    n_steps: [3, 4, 5]
    gamma: 1.5
    max_epochs: 100
    patience: 15
  tabtransformer_numeric_adapted:
    learning_rate: [0.0001, 0.0005, 0.001]
    width: [32, 64, 128]
    dropout: [0.1, 0.2, 0.3]
    layers: 4
    max_epochs: 100
    patience: 15
  ft_transformer_numeric_adapted:
    learning_rate: [0.0001, 0.0005, 0.001]
    width: [32, 64, 128]
    dropout: [0.1, 0.2, 0.3]
    layers: 3
    max_epochs: 100
    patience: 15
  trompt_numeric_adapted:
    learning_rate: [0.0001, 0.0005, 0.001]
    width: [64, 128, 192]
    num_prompts: [32, 64, 128]
    layers: 6
    max_epochs: 100
    patience: 15

two_stage_lightgbm_adapted:
  base_settings:
    - {n_estimators: 300, num_leaves: 15, learning_rate: 0.03, subsample: 0.85, colsample_bytree: 0.85}
    - {n_estimators: 600, num_leaves: 15, learning_rate: 0.05, subsample: 0.90, colsample_bytree: 0.90}
    - {n_estimators: 300, num_leaves: 31, learning_rate: 0.05, subsample: 0.85, colsample_bytree: 0.85}
    - {n_estimators: 600, num_leaves: 31, learning_rate: 0.03, subsample: 0.90, colsample_bytree: 0.90}
  resampling: [none, smote, smote_enn, kmeans_centroids]
  cv_folds: 3
  importance_tail_mass: 0.01
  accuracy_min_improvement: 0.005
  wrapper_patience: 3
  wrapper_min_features: 2

csstacking_adapted:
  prefilter_features: [8, 12, 18]
  feature_count: [4, 6, 8]
  feature_selection_folds: 2
  stacking_folds: 3
